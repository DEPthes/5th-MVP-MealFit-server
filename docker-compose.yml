services:
  mysql:
    image: mysql:8.4
    container_name: mealfit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    # 외부에 3306을 절대 열지 않습니다. 서버컴 안에서만 접근 가능.
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mealfit

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mealfit-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul

      # --- 데이터베이스 ---
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"

      # --- JWT ---
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

      # --- Gemini ---
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}

      # --- 네이버 CLOVA OCR ---
      CLOVA_OCR_INVOKE_URL: ${CLOVA_OCR_INVOKE_URL}
      CLOVA_OCR_SECRET_KEY: ${CLOVA_OCR_SECRET_KEY}

      # --- 파일 업로드 ---
      FILE_ROOT_PATH: /app/uploads
      FILE_ALLOWED_EXTENSIONS: ${FILE_ALLOWED_EXTENSIONS}
      FILE_MAX_SIZE_BYTES: ${FILE_MAX_SIZE_BYTES}

      # Tomcat이 요청을 받아들이는 한계. 위의 FILE_MAX_SIZE_BYTES(앱 자체 검증)와 별개이며,
      # 이쪽이 더 앞단이라 여기서 막히면 FileValidator까지 가지도 못하고 500이 난다.
      # application.properties는 이미지에 안 들어가므로(.dockerignore) 여기서 반드시 지정해야 한다.
      # 안 하면 Spring 기본값 1MB가 적용돼 웬만한 인바디 사진이 전부 거부된다.
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 10MB
      # 파일 10MB + 멀티파트 경계·헤더 오버헤드가 더해지므로 요청 전체 한도는 조금 더 크게 잡는다.
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 12MB

      # --- CORS (프론트 주소 허용 목록) ---
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}

      # --- 메일 (비밀번호 재설정) ---
      # 이 값들이 없으면 JavaMailSender 빈이 만들어지지 않아 EmailService 주입이 실패하고,
      # 앱이 기동조차 되지 않는다. 비밀번호 재설정 기능을 쓰지 않더라도 반드시 채워야 한다.
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: "587"
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"

      # 재설정 메일에 담길 링크의 앞부분. 프론트 배포 주소를 넣는다.
      APP_PASSWORD_RESET_URL: ${APP_PASSWORD_RESET_URL}
    volumes:
      # 업로드된 파일이 컨테이너를 지워도 남도록 호스트에 보관
      - ./uploads:/app/uploads
    ports:
      # 이 VM 밖(다른 호스트의 Nginx Proxy Manager)에서 <이 VM의 LAN IP>:8080으로
      # 붙을 수 있게 호스트에 노출한다. NPM에서 Proxy Host를 이 포트로 연결한다.
      - "8080:8080"
    networks:
      - mealfit

volumes:
  mysql-data:

networks:
  mealfit:
    driver: bridge
