services:
  mysql:
    image: mysql:8.4
    container_name: mealfit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    # 외부에 3306을 절대 열지 않습니다. 서버컴 안에서만 접근 가능.
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mealfit

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mealfit-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul

      # --- 데이터베이스 ---
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"

      # --- JWT ---
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

      # --- Gemini ---
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}

      # --- 네이버 CLOVA OCR ---
      CLOVA_OCR_INVOKE_URL: ${CLOVA_OCR_INVOKE_URL}
      CLOVA_OCR_SECRET_KEY: ${CLOVA_OCR_SECRET_KEY}

      # --- 파일 업로드 ---
      FILE_ROOT_PATH: /app/uploads
      FILE_ALLOWED_EXTENSIONS: ${FILE_ALLOWED_EXTENSIONS}
      FILE_MAX_SIZE_BYTES: ${FILE_MAX_SIZE_BYTES}

      # --- CORS (프론트 주소 허용 목록) ---
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
    volumes:
      # 업로드된 파일이 컨테이너를 지워도 남도록 호스트에 보관
      - ./uploads:/app/uploads
    ports:
      # 이 VM 밖(다른 호스트의 Nginx Proxy Manager)에서 <이 VM의 LAN IP>:8080으로
      # 붙을 수 있게 호스트에 노출한다. NPM에서 Proxy Host를 이 포트로 연결한다.
      - "8080:8080"
    networks:
      - mealfit

volumes:
  mysql-data:

networks:
  mealfit:
    driver: bridge
