spring.application.name=MVP-MealFit

# ===========================
# JWT
# ===========================
jwt.issuer=mealfit
jwt.secret=change-this-to-a-long-random-string-at-least-32-bytes-for-hs256
jwt.expiration=86400000

# ===========================
# File Upload
# ===========================
file.allowed-extensions=jpg,jpeg,png
file.max-size-bytes=10485760
file.root-path=./uploads